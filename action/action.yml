name: 'Cardea audit'
description: 'Audit a Claude Code skill for security, spec compliance, and runtime breakage. Emits a score, a JSON report, and an SVG badge.'
inputs:
  path:
    description: 'Path to the skill folder to audit'
    required: false
    default: '.'
  ref:
    description: 'Git ref of the Cardea repo to use'
    required: false
    default: 'main'
  fail-on-critical:
    description: 'Fail the job if the skill is DO-NOT-INSTALL'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Fetch Cardea
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (SHA-pinned: mutable tags are a supply-chain risk)
      with:
        repository: 'Leelaloo/cardea'   # TODO: replace OWNER when the repo is live
        ref: '${{ inputs.ref }}'
        path: '${{ runner.temp }}/cardea-tool'   # runner temp, NOT the workspace: a '.' audit must never scan the tool itself

    - name: Run audit
      shell: bash
      env:
        SKILL_PATH: ${{ inputs.path }}          # untrusted input goes through env, never direct interpolation
        FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: |
        set +e
        python3 "${RUNNER_TEMP}/cardea-tool/scripts/cardea.py" "$SKILL_PATH" \
          --json cardea-report.json \
          --badge cardea-badge.svg
        rc=$?
        set -e
        if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
          echo "::error::Cardea itself failed (exit $rc) — tool crashes must never read as a clean verdict."
          exit 1
        fi
        if [ ! -f cardea-report.json ]; then
          echo "::error::Cardea exited $rc but wrote no report — failing closed."
          exit 1
        fi
        echo "## Cardea report" >> $GITHUB_STEP_SUMMARY
        echo '```json' >> $GITHUB_STEP_SUMMARY
        cat cardea-report.json >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        if [ "${FAIL_ON_CRITICAL,,}" = "true" ] && { [ "$rc" = "2" ] || grep -q '"do_not_install": *true' cardea-report.json; }; then
          echo "::error::Cardea: DO NOT INSTALL — critical security finding(s). See the report artifact."
          exit 1
        fi

    - name: Upload report + badge
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (SHA-pinned)
      with:
        name: cardea-report
        path: |
          cardea-report.json
          cardea-badge.svg
        if-no-files-found: error
